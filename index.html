<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Màn hình xác minh QR bảo mật</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #25293a;
        overflow: hidden;
        position: fixed;
      }

      .viewer-container {
        /* margin-top: 40px; */
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .qr-image {
        margin-top: 70px;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: bottom center;
        display: block;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      /* Đồng bộ chuẩn font hệ thống iOS / PingFang SC như trong ảnh */
      .countdown-timer {
        position: absolute;
        bottom: 36%;
        left: 50%;
        transform: translateX(-50%);

        /* Chuỗi font gốc của ứng dụng trên iOS */
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-variant-numeric: tabular-nums; /* Cố định độ rộng từng con số để không bị giật khi đếm */
        -webkit-font-smoothing: antialiased;

        color: #19be6b; /* Mã màu xanh lục dịu giống hệt số 02:09 trong ảnh */
        font-size: 16px;
        font-weight: 450; /* Nét thanh mảnh tự nhiên thay vì in đậm */
        letter-spacing: 0.5px;

        user-select: none;
        pointer-events: none;
      }

      .timer {
        position: absolute;
        top: 23.5%;
        left: 50%;
        transform: translateX(-50%);

        font-family:
          system-ui,
          -apple-system,
          sans-serif;

        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;

        color: #3a393a;
        font-size: 15px;
        font-weight: 480;
        letter-spacing: -0.5px;
        white-space: nowrap;

        user-select: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="viewer-container">
      <img src="qr.png" alt="Màn hình xác minh QR bảo mật" class="qr-image" />
      <div class="countdown-timer" id="countdownTimer">02:30</div>
      <div class="timer" id="timer"></div>
    </div>

    <script>
      let timeLeft = 150;
      const timerElement = document.getElementById("countdownTimer");
      function pad(n) {
        return String(n).padStart(2, "0");
      }
      function updateTimer() {
        const minutes = String(Math.floor(timeLeft / 60)).padStart(2, "0");
        const seconds = String(timeLeft % 60).padStart(2, "0");

        timerElement.textContent = `${minutes}:${seconds}`;
        if (timeLeft > 0) {
          timeLeft--;
        } else {
          timeLeft = 150;
        }
      }

      function updateDateTime() {
        const now = new Date();
        const text =
          `${now.getFullYear()}-` +
          `${pad(now.getMonth() + 1)}-` +
          `${pad(now.getDate())} ` +
          `${pad(now.getHours())}:` +
          `${pad(now.getMinutes())}:` +
          `${pad(now.getSeconds())}`;

        document.querySelector(".timer").textContent = text;
      }
      updateTimer();
      updateDateTime();
      setInterval(updateTimer, 1000);
    </script>
  </body>
</html>
