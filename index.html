<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Màn hình xác minh QR bảo mật</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #25293a;
        overflow: hidden;
        position: fixed;
      }

      .viewer-container {
        margin-top: 40px;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .qr-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: bottom center;
        display: block;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      /* Đồng bộ chuẩn font hệ thống iOS / PingFang SC như trong ảnh */
      .countdown-timer {
        position: absolute;
        bottom: 42%;
        left: 50%;
        transform: translateX(-50%);

        /* Chuỗi font gốc của ứng dụng trên iOS */
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-variant-numeric: tabular-nums; /* Cố định độ rộng từng con số để không bị giật khi đếm */
        -webkit-font-smoothing: antialiased;
        
        color: #19be6b; /* Mã màu xanh lục dịu giống hệt số 02:09 trong ảnh */
        font-size: clamp(19px, 4.8vw, 22px);
        font-weight: 400; /* Nét thanh mảnh tự nhiên thay vì in đậm */
        letter-spacing: 0.5px;
        
        user-select: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="viewer-container">
      <img
        src="qr_code.png"
        alt="Màn hình xác minh QR bảo mật"
        class="qr-image"
      />
      <div class="countdown-timer" id="countdownTimer">02:30</div>
    </div>

    <script>
      let timeLeft = 150;
      const timerElement = document.getElementById('countdownTimer');

      function updateTimer() {
        const minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const seconds = String(timeLeft % 60).padStart(2, '0');

        timerElement.textContent = `${minutes}:${seconds}`;

        if (timeLeft > 0) {
          timeLeft--;
        } else {
          timeLeft = 150;
        }
      }

      updateTimer();
      setInterval(updateTimer, 1000);
    </script>
  </body>
</html>
